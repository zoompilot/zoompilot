# Page: device
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: device
label: Device
icon: device
order: 6
remote_configurable: true
description: Device behavior, units, and recording settings
sections:
- id: general
  title: General
  description: Power, boot, and unit preferences
  items:
  - key: OffroadModeRequested
    widget: toggle
    title: Force Offroad Mode
  - key: DeviceBootMode
    widget: option
    title: Wake Up Behavior
    description: 'Controls state of the device after boot/sleep. Default: Device will boot/wake-up normally and will be ready
      to engage. Offroad: Device will be in Always Offroad mode after boot/wake-up.'
    options:
    - value: 0
      label: Standard
    - value: 1
      label: Always Offroad
  - key: QuietMode
    widget: toggle
    title: Quiet Mode
  - key: OnroadUploads
    widget: toggle
    title: Onroad Uploads
  - key: MaxTimeOffroad
    widget: option
    title: Max Time Offroad
    description: Device will automatically shutdown after set time once the engine is turned off. 30h is the default.
    options:
    - value: 0
      label: Always On
    - value: 5
      label: 5m
    - value: 10
      label: 10m
    - value: 15
      label: 15m
    - value: 30
      label: 30m
    - value: 60
      label: 1h
    - value: 120
      label: 2h
    - value: 180
      label: 3h
    - value: 300
      label: 5h
    - value: 600
      label: 10h
    - value: 1440
      label: 24h
    - value: 1800
      label: 30h (Default)
- id: language
  title: Language
  items:
  - key: LanguageSetting
    widget: info
    title: Language
- id: zoo_s3
  title: zoo Private Archive
  description: Encrypted driving-data archive in your own S3-compatible bucket
  items:
  - key: ZooS3Enabled
    widget: toggle
    title: Private S3 Archive
    description: 'Uploads a copy of your driving data to your own S3-compatible bucket. Endpoint, bucket, and credentials are one-time setup with tools/zoo/configure.py.'
  - key: ZooS3Encryption
    widget: toggle
    title: Encryption
    description: 'Encrypt every uploaded file to your PGP key on the device. Needs the key from the configure.py setup. Off: files are readable to anyone with access to the bucket.'
  - key: ZooS3Scope
    widget: option
    title: Upload Scope
    description: 'Minimal uploads qlogs, compressed camera segments, and crash/boot logs. Full uploads everything. Selected uploads only routes you keep with tools/zoo/fetch.py keep.'
    options:
    - value: minimal
      label: Minimal (qlog + qcam + crash/boot)
    - value: full
      label: Full archive
    - value: selected
      label: Selected routes only
  - key: ZooS3UploadContents
    widget: option
    title: Uploaded Route Contents
    description: 'What an upload request sends for its route. Default uploads qlog and the compressed camera. Road adds the road camera and rlog. Everything uploads rlog, all cameras (driver camera when available), and the default files.'
    options:
    - value: default
      label: Default (qlog + qcam)
    - value: road
      label: Road cam + rlog
    - value: everything
      label: Everything (rlog + all cameras)
